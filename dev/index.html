<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <title>@wyttime04/react-vditor 開發用畫面</title>
    <link rel="stylesheet" href="/react-vditor.css"/>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #f6f8fa; color: #24292f; }
        header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #d0d7de; }
        header h1 { font-size: 16px; margin: 0 16px 0 0; }
        header label { font-size: 14px; }
        main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
        section { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 12px; min-width: 0; }
        section h2 { font-size: 14px; margin: 0 0 8px; color: #57606a; }
        pre.output { max-height: 240px; overflow: auto; background: #f6f8fa; padding: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
        ol.log { max-height: 160px; overflow: auto; font-size: 12px; margin: 0; padding-left: 24px; }
    </style>
</head>
<body>
<div id="root"></div>
<script src="/main.js"></script>
</body>
</html>
